<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Studio Calanque">
  <title>Studio Calanque</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fd0c9"/>
      <stop offset="100%" stop-color="#1b8ac9"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- sky and, below the horizon, the water of the inlet -->
    <rect width="32" height="32" fill="#0d3b4f"/>
    <rect y="17" width="32" height="15" fill="url(#sea)"/>
    <!-- the sun sitting in the gap between the two headlands -->
    <circle cx="16" cy="11" r="4" fill="#f2b134"/>
    <!-- limestone headlands closing in on the water -->
    <path d="M0 32V12l13 20Z" fill="#efe6d3"/>
    <path d="M32 32V9L19 32Z" fill="#d8c8ad"/>
  </g>
</svg>
